name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: 'Breaking changes'
    labels: [ 'breaking' ]
  - title: 'Features'
    labels: [ 'feature', 'enhancement' ]
  - title: 'Fixes'
    labels: [ 'bug', 'fix' ]
  - title: 'Dependencies'
    labels: [ 'dependencies' ]
template: |
  ## Changes

  $CHANGES
